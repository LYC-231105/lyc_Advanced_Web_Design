<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>层叠与继承+盒模型</title>

  <style>
    * {
      padding: 0;
      margin: 0;
      /* 设置的宽高包含内容、内边距和边框，不包含外边距 */
      box-sizing: border-box;
    }

    body {
      background-color: yellow;
      font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
      color: blue;
      line-height: 1.7;
    }

    .container {
      width: 1200px;
      max-width: calc(100% - 32px);
      margin: 40px auto;
      padding: 20px;
      background-color: red;
    }

    /* 其他层叠条件相同时，类选择器优先级高于标签选择器 */
    .container-title {
      color: black;
    }

    h2 {
      color: white;
      text-align: center;
      margin-bottom: 20px;
      font-size: 30px;
      padding: 10px 20px;
      border: 2px dotted white;
    }

    /* ID 选择器优先级高于本例的类选择器 */
    #card-wrap {
      background-color: orange;
    }

    .card-wrap {
      background-color: pink;
      padding: 20px;
      margin-bottom: 24px;
    }

    .card {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
      border: 2px solid blue;
      background-color: white;
    }

    /* 示意图直接内嵌在 HTML 中，不依赖外部图片 */
    .card svg {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 16px;
    }

    .card h3 {
      margin-bottom: 8px;
      font-size: 24px;
    }

    .card-desc + .card-desc {
      margin-top: 8px;
    }

    .answer-list {
      padding: 20px 20px 20px 48px;
      background-color: white;
    }

    .answer-list li + li {
      margin-top: 10px;
    }

    /* 手机屏幕适配 */
    @media (max-width: 600px) {
      .container {
        margin: 16px auto;
        padding: 12px;
      }

      h2 {
        padding: 10px;
        font-size: 24px;
      }

      .card-wrap,
      .card {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2 class="container-title">层叠与继承+盒模型</h2>

    <div class="card-wrap" id="card-wrap">
      <div class="card">
        <!-- 使用内嵌 SVG，解决图片路径失效的问题 -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="760"
          height="400"
          viewBox="0 0 760 400"
          role="img"
          aria-labelledby="box-title box-desc"
        >
          <title id="box-title">CSS 盒模型示意图</title>
          <desc id="box-desc">
            由外向内依次是外边距 margin、边框 border、
            内边距 padding、内容 content。
          </desc>

          <g
            font-family="Microsoft YaHei, sans-serif"
            font-size="22"
            text-anchor="middle"
            fill="#17233b"
          >
            <!-- 外边距 -->
            <rect
              x="10"
              y="10"
              width="740"
              height="380"
              rx="8"
              fill="#f8cca4"
              stroke="#925628"
              stroke-width="2"
              stroke-dasharray="7 5"
            />
            <text x="380" y="46">margin · 外边距</text>

            <!-- 边框 -->
            <rect
              x="60"
              y="65"
              width="640"
              height="280"
              fill="#ffe69c"
              stroke="#95751b"
              stroke-width="2"
            />
            <text x="380" y="99">border · 边框</text>

            <!-- 内边距 -->
            <rect
              x="110"
              y="120"
              width="540"
              height="170"
              fill="#c6e6ac"
              stroke="#4d7b31"
              stroke-width="2"
            />
            <text x="380" y="156">padding · 内边距</text>

            <!-- 内容区域 -->
            <rect
              x="165"
              y="177"
              width="430"
              height="66"
              fill="#b9dff5"
              stroke="#306f97"
              stroke-width="2"
            />
            <text x="380" y="218">content · 内容</text>

            <text x="380" y="375" font-size="17">
              border-box：width 包含 content + padding + border
            </text>
          </g>
        </svg>

        <h3>盒模型</h3>

        <p class="card-desc">
          盒模型：content、padding、border、margin。
        </p>

        <p class="card-desc">
          当前采用 border-box，设置的宽度包含内容、内边距和边框，
          不包含外边距。
        </p>
      </div>
    </div>

    <h2>通关游戏答案</h2>

    <ol class="answer-list">
      <li>plate</li>              <!-- 1. 类型选择器 -->
      <li>bento</li>              <!-- 2. 类型选择器 -->
      <li>#fancy</li>             <!-- 3. ID 选择器 -->
      <li>plate apple</li>        <!-- 4. 后代选择器 -->
      <li>#fancy pickle</li>      <!-- 5. ID + 后代 -->
      <li>.small</li>             <!-- 6. 类选择器 -->
      <li>orange.small</li>       <!-- 7. 标签 + 类（连写） -->
      <li>bento orange.small</li> <!-- 8. 综合 -->
      <li>plate, bento</li>       <!-- 9. 逗号并列 -->
      <li>*</li>                 <!-- 10. 通配选择器 -->
    </ol>
  </div>
</body>
</html>
