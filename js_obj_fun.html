<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
console.log(Math.floor(1.9));//向下取整
console.log(Math.round(1.9));//四舍五入
console.log(Math.random());//随机数，0-1之间
console.log(Math.floor(Math.random()*101));//随机数[0~100]取整数

var date = new Date();
console.log(date.getFullYear());//获取年份
console.log(date.getMonth()+1);//获取月份
console.log(date.getDate());//获取日期
console.log(date.getDay());//获取星期几,0~6,0是星期日
console.log(date.getHours()+" "+date.getMinutes()+" "+date.getSeconds());//获取时、分、秒

//数组

    </script>
