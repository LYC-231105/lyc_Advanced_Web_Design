<!DOCTYPE html>
<!--
  唯品会特卖商城 - 商品详情页（三级页面）
  高级网页设计I 期末试题：手机APP模仿与设计（选题：唯品会）
  24001010817 梁钰承
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯品会特卖商城-商品详情-24001010817梁钰承</title>
    <link rel="stylesheet" href="css/liang.css">
    <link rel="icon" href="img/vip-favicon.ico">
</head>
<body>
    <div class="liang-app">

        <header class="liang-header">
            <div class="liang-header-top">
                <button class="liang-header-back" type="button" aria-label="返回上一页">‹</button>
                <h1 class="liang-header-title">商品详情</h1>
                <a class="liang-header-right" href="cart.html">购物车</a>
            </div>
        </header>

        <main class="liang-main" style="padding-bottom:70px">

            <!-- 商品图集：JS 效果 缩略图切换主图 -->
            <div class="liang-detail-gallery">
                <img class="liang-detail-mainimg" id="liangMainImg" src="img/products/product-1-1.webp" alt="商品主图">
                <div class="liang-detail-thumbs" id="liangThumbs"></div>
            </div>

            <!-- 价格与名称 -->
            <div class="liang-detail-info" id="liangDetailInfo">
                <p class="liang-detail-price">
                    <em>¥</em><strong id="liangPrice">0</strong>
                    <del id="liangMarketPrice">¥0</del>
                    <span class="liang-detail-tag" id="liangOffTag">2折</span>
                </p>
                <h2 class="liang-detail-name" id="liangName">加载中...</h2>
                <p class="liang-detail-desc" id="liangDesc"></p>
                <div class="liang-detail-service">
                    <span>正品保障</span><span>顺丰包邮</span><span>7天退换</span><span>假一赔十</span>
                </div>
            </div>

            <!-- 规格：JS 效果 规格选择 -->
            <div class="liang-detail-block">
                <div class="liang-detail-row">
                    <span>选择<b id="liangSpecName">规格</b></span>
                    <span id="liangStock" class="liang-cell-extra">库存 --</span>
                </div>
                <div class="liang-detail-specs" id="liangSpecs"></div>

                <!-- 购买数量：JS 效果 数量增减 -->
                <div class="liang-detail-count">
                    <span>购买数量</span>
                    <div class="liang-detail-count-box">
                        <button id="liangCountMinus" type="button">−</button>
                        <span id="liangCount">1</span>
                        <button id="liangCountPlus" type="button">+</button>
                    </div>
                </div>
            </div>

            <!-- 商品评价：fetch 评价接口 -->
            <div class="liang-detail-block">
                <div class="liang-detail-row">
                    <span>商品评价(<b id="liangReviewCount">0</b>)</span>
                    <span class="liang-cell-extra">好评率 99%</span>
                </div>
                <ul class="liang-detail-reviews" id="liangReviews"></ul>
            </div>

            <!-- 服务承诺图 -->
            <div class="liang-service-strip" aria-label="购物服务"><span>✓ 正品保障</span><span>✓ 品牌特卖</span><span>✓ 售后无忧</span></div>
        </main>

        <!-- 底部操作栏 -->
        <div class="liang-detail-bar">
            <a class="liang-bar-icon" href="index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
                </svg>首页
            </a>
            <a class="liang-bar-icon" href="cart.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 4h2l2.5 12h11L21 8H6"/>
                    <circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/>
                </svg>购物车<span class="liang-cart-badge" style="display:none"></span>
            </a>
            <button class="liang-bar-cart" id="liangAddCart" type="button">加入购物车</button>
            <button class="liang-bar-buy" id="liangBuyNow" type="button">立即抢购</button>
        </div>

        <!-- 加购结果提示浮层 -->
        <div class="liang-sheet-mask" id="liangSheetMask"></div>
        <div class="liang-sheet" id="liangSheet">
            <button class="liang-sheet-close" id="liangSheetClose" type="button">×</button>
            <h3 style="font-size:15px">加入购物车成功</h3>
            <p style="font-size:13px;color:#888;margin-top:6px" id="liangSheetMsg"></p>
            <div style="display:flex;gap:10px;margin-top:16px">
                <a href="cart.html" style="flex:1;height:40px;line-height:40px;text-align:center;border:1px solid var(--liang-pink);color:var(--liang-pink);border-radius:20px">去购物车结算</a>
                <a href="index.html" style="flex:1;height:40px;line-height:40px;text-align:center;color:#fff;background:var(--liang-pink);border-radius:20px">继续逛逛</a>
            </div>
        </div>
    </div>

    <script src="js/liang-mock.js"></script>
    <script src="js/liang-common.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
