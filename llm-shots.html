<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <title>LLM 实践 · 测试截图 | 梁钰承</title>
    <style>
        /* 原生 CSS：与课堂实践首页共用同一套配色与排版。 */
        :root {
            color-scheme: light;
            --paper: #f6f5ef;
            --surface: #fffefa;
            --ink: #223c37;
            --muted: #697771;
            --green: #245c4f;
            --line: #dedfd5;
            --radius: 22px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-width: 280px;
            min-height: 100vh;
            padding: 56px 28px 28px;
            background: radial-gradient(ellipse at 90% 0%, #e5ebdf 0, transparent 48%), var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }

        .container { max-width: 1180px; margin: 0 auto; }

        /* 顶部标题区：与首页 hero 保持同一视觉语言。 */
        .hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            padding: 46px 52px 44px;
            border: 1px solid #315e50;
            border-radius: 28px;
            background: linear-gradient(115deg, #183d33, #285547);
            box-shadow: 0 18px 42px -28px #183d3366;
        }

        .hero::before, .hero::after {
            content: "";
            position: absolute;
            z-index: -1;
            width: 360px;
            height: 360px;
            right: -70px;
            top: -70px;
            border: 1px solid #d6e6bc22;
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::after { width: 480px; height: 480px; top: -130px; right: -130px; }

        .hero .back {
            display: inline-block;
            margin-bottom: 22px;
            padding: 6px 14px;
            border: 1px solid #d5e4b75c;
            border-radius: 100px;
            color: #d9e6bd;
            font-size: 12px;
            letter-spacing: .5px;
            text-decoration: none;
        }

        .hero h1 {
            color: #faf9ed;
            font-size: clamp(24px, 3vw, 34px);
            font-weight: 650;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .hero .subtitle {
            margin-top: 12px;
            color: #d2dfd2;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .note {
            margin-top: 22px;
            padding: 18px 24px;
            border: 1px solid #e2dfce;
            border-radius: 16px;
            background: #efeee3;
            color: #6d7260;
            font-size: 12.5px;
            line-height: 1.95;
        }

        .shots {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 22px;
            margin-top: 22px;
        }

        .shot {
            min-width: 0;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 4px 12px #243e3303;
        }

        .shot img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #e6e7dc;
            border-radius: 10px;
            background: #ffffff;
        }

        .shot figcaption {
            padding: 12px 8px 6px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.9;
        }

        .shot figcaption b { color: var(--green); font-weight: 600; }

        .footer { margin-top: 26px; text-align: center; font-size: 11px; letter-spacing: 1.5px; color: #788173; }

        @media (max-width: 760px) {
            body { padding: 24px 18px; }
            .hero { padding: 32px 26px; border-radius: 22px; }
            .hero h1 { font-size: 23px; }
            .hero .subtitle { font-size: 12px; }
            .note { padding: 16px 18px; }
            .shot { padding: 9px; border-radius: 14px; }
            .shot figcaption { font-size: 12px; }
        }
    </style>
</head>
